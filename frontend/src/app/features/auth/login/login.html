<div class="login-page">
  <div class="login-shell">
    <aside class="brand-panel" aria-label="MPloyChek overview">
      <div class="brand-block">
        <div class="brand-mark">M</div>

        <div class="brand-copy">
          <h1>MPloyChek</h1>
          <p>Access &amp; Verification Platform</p>
        </div>
      </div>

      <div class="brand-content">
        <span class="eyebrow">Trusted access</span>
        <h2>Secure identity, compliant verification, and streamlined access control.</h2>
      </div>

      <div class="status-pill">
        <span class="status-dot"></span>
        Protected workspace
      </div>
    </aside>

    <main class="login-panel">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-mark small">M</div>
        </div>

        <div class="login-header">
          <h2>Welcome back</h2>
          <p>Sign in to access your secure workspace.</p>
        </div>

        <form autocomplete="off" (ngSubmit)="login()" novalidate>
          <div class="form-group">
            <label for="userId">User ID</label>

            <input
              id="userId"
              type="text"
              name="userId"
              [(ngModel)]="userId"
              placeholder="Enter your User ID"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                [(ngModel)]="password"
                placeholder="Enter your password"
                autocomplete="new-password"
              />

              <button
                type="button"
                class="password-toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [attr.title]="showPassword ? 'Hide password' : 'Show password'"
              >
                @if (showPassword) {
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10 3.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/>
                    <path d="M4 4l16 16"/>
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3.2"/>
                  </svg>
                }
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="role">Role</label>

            <select id="role" name="role" [(ngModel)]="role">
              <option value="GENERAL_USER">General User</option>
              <option value="ADMIN">Administrator</option>
            </select>
          </div>

          @if (errorMessage) {
            <div class="error-message" role="alert">
              {{ errorMessage }}
            </div>
          }

          <button class="submit-button" type="submit" [disabled]="loading">
            @if (loading) {
              <span class="button-loader" aria-hidden="true"></span>
              <span>Signing in...</span>
            } @else {
              Sign In
            }
          </button>
        </form>

        <div class="security-note">
          <span class="status-dot"></span>
          Secure authentication · JWT protected
        </div>
      </div>
    </main>
  </div>
</div>
